
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeFlow Organizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; }
    #root:empty::before {
      content: 'Iniciando LifeFlow...';
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-weight: 800;
      color: #6366f1;
      font-size: 1.2rem;
      letter-spacing: -0.025em;
    }
    .error-overlay {
      position: fixed; inset: 0; background: white; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem; text-align: center;
    }
  </style>
  <script>
    // 1. Shim de Process (Crítico para GenAI e Deploys)
    window.process = { env: { API_KEY: "" } };
    
    // 2. Captura de Erros de Inicialização
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML = `
          <div class="error-overlay">
            <h1 style="font-weight: 900; color: #ef4444;">Ops! Algo travou.</h1>
            <p style="color: #64748b; margin-top: 1rem;">Ocorreu um erro ao carregar o seu banco de dados.</p>
            <code style="background: #f1f5f9; padding: 1rem; border-radius: 0.5rem; margin-top: 1rem; font-size: 0.8rem;">${msg}</code>
            <button onclick="location.reload()" style="margin-top: 2rem; background: #0f172a; color: white; padding: 0.8rem 1.5rem; border-radius: 0.8rem; font-weight: bold; border: none; cursor: pointer;">Tentar Novamente</button>
          </div>
        `;
      }
      return false;
    };
  </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
